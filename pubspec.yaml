name: budgetmanager
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  flutter_local_ai: ^0.0.15  # Run tool/patch_flutter_local_ai.sh after pub get (built-in Kotlin)
  get_it: ^9.2.1
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  logger: ^2.6.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  uuid: ^4.5.3
  google_fonts: ^8.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^9.0.0
  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  macos:
    generate: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#F4F5FF"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
